workflows:
ios-native-quick-start:
name: AQXQ26
max_build_duration: 120
instance_type: mac_mini_m2

```
integrations:
  app_store_connect: AQXQ26

environment:
  ios_signing:
    distribution_type: app_store
    bundle_identifier: com.AQXQ26.duo

  vars:
    BUNDLE_ID: "com.AQXQ26.duo"
    PROJECT_PATH: "AQXQ26"
    XCODE_WORKSPACE: "$PROJECT_PATH/$PROJECT_PATH.xcworkspace"
    XCODE_SCHEME: "$PROJECT_PATH"
    APP_STORE_APPLE_ID: "6821680099"

  xcode: latest
  cocoapods: default

scripts:
  - name: Install CocoaPods dependencies
    script: |
      set -e
      cd "$CM_BUILD_DIR/$PROJECT_PATH"
      pod install

  - name: Set up provisioning profiles settings on Xcode project
    script: |
      set -e
      xcode-project use-profiles

  - name: Increment build number
    script: |
      set -e
      cd "$CM_BUILD_DIR/$PROJECT_PATH"
      LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
      NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
      agvtool new-version -all "$NEXT_BUILD_NUMBER"

  - name: Build ipa for distribution
    script: |
      set -e
      xcode-project build-ipa \
        --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
        --scheme "$XCODE_SCHEME"

artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

publishing:
  email:
    recipients:
      - 654326278@qq.com
      - diedlckers_332@example.com
    notify:
      success: true
      failure: false

  app_store_connect:
    auth: integration
    submit_to_app_store: false
```

