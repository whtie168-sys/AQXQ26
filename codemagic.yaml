workflows:

  ios-native-quick-start:

    name: AQXQ26

    max_build_duration: 120

    instance_type: mac_mini_m2


    integrations:

      app_store_connect: AQXQ26


    environment:

      ios_signing:

        distribution_type: app_store

        # 主 App 和通知服务扩展（com.QiuXQ.Relase.ex1）各需要一个 App Store 描述文件。
        # 这里只写主 App 的 ID，以它开头的扩展 ID 的描述文件也会一起取到
        bundle_identifier: com.AQXQ26.duo


      vars:

        BUNDLE_ID: com.AQXQ26.duo

        PROJECT_PATH: "AQXQ26"

        XCODE_WORKSPACE: "AQXQ26/AQXQ26"

        XCODE_SCHEME: "AQXQ26"

        APP_STORE_APPLE_ID: 6821680099


      xcode: latest



    scripts:


      - name: Set up provisioning profiles settings on Xcode project

        script: |

          xcode-project use-profiles



      - name: Increment build number

        script: |

          set -e
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          if [ -z "$LATEST" ]; then LATEST=0; fi
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest on App Store Connect: $LATEST -> using build $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"


      - name: Build ipa for distribution

        script: |

          # 主 App 和扩展用同一个 build number（不一致会被 App Store 拒收）
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            --disable-xcpretty



    artifacts:

      - build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM



    publishing:


      email:

        recipients:

          - 985446278@qq.com

          - user_2@example.com


        notify:

          success: true

          failure: false



      app_store_connect:

        auth: integration

        submit_to_testflight: true

        submit_to_app_store: false
