workflows:
ios-native-quick-start:
name: AQXQ26
max_build_duration: 120
instance_type: mac_mini_m2

```
integrations:
  app_store_connect: AQXQ26

environment:
  ios_signing:
    distribution_type: app_store
    bundle_identifier: com.AQXQ26.duo

  vars:
    BUNDLE_ID: "com.AQXQ26.duo"
    PROJECT_PATH: "AQXQ26"
    XCODE_WORKSPACE: "AQXQ26/AQXQ26.xcworkspace"
    XCODE_SCHEME: "AQXQ26"
    APP_STORE_APPLE_ID: "6821680099"

  xcode: latest
  cocoapods: default

scripts:
  - name: Install CocoaPods dependencies
    script: |
      set -e
      cd "$CM_BUILD_DIR/$PROJECT_PATH"
      pod install

  - name: Set up provisioning profiles
    script: |
      set -e
      xcode-project use-profiles

  - name: Check signing settings
    script: |
      echo "Checking AQXQ26 signing settings..."
      xcodebuild \
        -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
        -scheme "$XCODE_SCHEME" \
        -showBuildSettings \
        2>/dev/null \
        | grep -E 'PRODUCT_BUNDLE_IDENTIFIER =|CODE_SIGN_STYLE =|PROVISIONING_PROFILE_SPECIFIER =|PROVISIONING_PROFILE =' || true

  - name: Increment build number
    script: |
      set -e
      cd "$CM_BUILD_DIR/$PROJECT_PATH"
      LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
      NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
      echo "Next build number: $NEXT_BUILD_NUMBER"
      agvtool new-version -all "$NEXT_BUILD_NUMBER"

  - name: Build ipa for distribution
    script: |
      set -e
      xcode-project build-ipa \
        --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
        --scheme "$XCODE_SCHEME"

artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

publishing:
  email:
    recipients:
      - 98227008@qq.com
      - udakfkesk@example.com
    notify:
      success: true
      failure: false

  app_store_connect:
    auth: integration
    submit_to_testflight: true
    submit_to_app_store: false
```
